name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests come from anyone; the job reads the code and nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Test
        run: make test

      - name: Build app bundle
        run: make app

      - name: Check the bundle is signed and complete
        run: |
          codesign --verify --deep --strict --verbose=2 build/DockFixer.app
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/DockFixer.app/Contents/Info.plist
          lipo -archs build/DockFixer.app/Contents/MacOS/DockFixer
