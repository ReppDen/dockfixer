name: Release

on:
  push:
    # Plain versions only: every published release goes to all users within a day.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Never change: users' Accessibility grant is tied to this certificate.
  RELEASE_CERT_SHA1: 7ee1e6b6e630e61adfdc1fbdb2c904cc99812e81
  SIGN_IDENTITY: DockFixer Release
  FEED_URL: https://github.com/ReppDen/dockfixer/releases/latest/download/appcast.xml
  # Must match the Sparkle version in Package.swift.
  SPARKLE_VERSION: 2.10.0
  SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c

jobs:
  build:
    runs-on: macos-26
    outputs:
      file: ${{ steps.sum.outputs.file }}
      version: ${{ steps.sum.outputs.version }}
      sha: ${{ steps.sum.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: make test

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.RELEASE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/release.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -x -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/release.p12"
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Package
        env:
          USAGE_KEY: ${{ secrets.USAGE_KEY }}
        run: |
          make zip VERSION="${GITHUB_REF_NAME#v}" USAGE_KEY="$USAGE_KEY" \
            SIGN_IDENTITY="$SIGN_IDENTITY" FEED_URL="$FEED_URL"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db"

      - name: Check the bundle
        run: |
          APP=build/DockFixer.app
          codesign --verify --deep --strict "$APP"
          REQ="$(codesign -d -r- "$APP" 2>&1 | grep designated)"
          echo "$REQ"
          echo "$REQ" | grep -q "certificate leaf = H\"$RELEASE_CERT_SHA1\"" \
            || { echo "signed with the wrong certificate"; exit 1; }
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/DockFixer")"
          echo "architectures: $ARCHS"
          case "$ARCHS" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "not a universal binary"; exit 1 ;; esac
          FEED="$(/usr/libexec/PlistBuddy -c 'Print SUFeedURL' "$APP/Contents/Info.plist")"
          [ "$FEED" = "$FEED_URL" ] || { echo "SUFeedURL is '$FEED'"; exit 1; }

      - name: Sign the update and write the feed
        id: sum
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="build/DockFixer-$VERSION.zip"
          curl -sSfL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/ed.key"
          SIGN_UPDATE="$RUNNER_TEMP/sparkle/bin/sign_update" \
          SPARKLE_ED_KEY_FILE="$RUNNER_TEMP/ed.key" \
            Scripts/appcast.sh "$VERSION" "$FILE" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/DockFixer-$VERSION.zip" \
            > build/appcast.xml
          rm "$RUNNER_TEMP/ed.key"
          cat build/appcast.xml
          swift Scripts/verify-update.swift "$FILE" build/appcast.xml build/DockFixer.app
          # The README's download link points at this name.
          cp "$FILE" build/DockFixer.zip
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ steps.sum.outputs.file }}
            build/DockFixer.zip
            build/appcast.xml
          if-no-files-found: error

  launch:
    needs: build
    strategy:
      matrix:
        # xcode-27 is macOS 27.
        runner: [macos-14, macos-15-intel, macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: build

      - name: Launch it
        run: |
          sw_vers
          echo "machine: $(uname -m)"
          ditto -x -k build/DockFixer.zip "$RUNNER_TEMP/app"
          "$RUNNER_TEMP/app/DockFixer.app/Contents/MacOS/DockFixer" &
          PID=$!
          sleep 10
          kill -0 "$PID" || { echo "DockFixer exited within 10 seconds"; cat ~/Library/Logs/DockFixer/dockfixer.log || true; exit 1; }
          kill "$PID"
          cat ~/Library/Logs/DockFixer/dockfixer.log

  publish:
    needs: [build, launch]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: build

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ needs.build.outputs.file }}
            build/DockFixer.zip
            build/appcast.xml
          generate_release_notes: true
          body: |
            Requires macOS 14 Sonoma or later, Apple silicon or Intel.

            **With Homebrew (recommended)**

            ```sh
            brew install reppden/tap/dockfixer
            ```

            **Or download it yourself**

            1. Download `DockFixer.zip` below.
            2. Unzip it.
            3. Move `DockFixer.app` to Applications.

            The first time you open DockFixer, macOS will not open it and says
            it cannot check the app. This is normal for a free app that is not
            in the App Store. Allow it once:

            1. Close the message.
            2. Open **System Settings → Privacy & Security**.
            3. Scroll down and click **Open Anyway** next to the line about DockFixer.
            4. Confirm.

            SHA-256 of both zips: `${{ needs.build.outputs.sha }}`

      - name: Update the Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          curl -sSf https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone git@github.com:ReppDen/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          Scripts/cask.sh "${{ needs.build.outputs.version }}" "${{ needs.build.outputs.sha }}" \
            > "$RUNNER_TEMP/tap/Casks/dockfixer.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dockfixer.rb
          if git diff --cached --quiet; then
            echo "cask already at ${{ needs.build.outputs.version }}"
          else
            git commit -m "dockfixer ${{ needs.build.outputs.version }}"
            git push
          fi
          rm ~/.ssh/tap
